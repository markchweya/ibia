# Keeps every dependency ecosystem in the repo patched. Minor and patch
# updates are grouped into one weekly PR per ecosystem to keep noise low;
# security updates still open immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /website
    schedule:
      interval: weekly
