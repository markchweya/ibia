name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/generate_icon.js

      - name: Build macOS app
        run: |
          # An unset secret expands to an empty string, and electron-builder reads
          # an empty CSC_LINK as a certificate *path* — which resolves to the
          # project directory and fails with "<projectDir> not a file". Drop the
          # empty values so it takes the unsigned path instead.
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate configured - building unsigned."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -z "$APPLE_ID" ]; then
            echo "No Apple ID configured - skipping notarization."
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi

          npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ibia-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

