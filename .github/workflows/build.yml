name: Build & Release

# Every push and pull request builds ibia for all three platforms so a broken
# build shows up before release. Pushing a v* tag (or running this workflow
# by hand) also publishes a GitHub Release with exactly one file per platform.
on:
  push:
    branches:
      - main
      - master
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in package.json"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run dist:mac -- --publish never
            artifact: dist/*-macOS.dmg
          - name: Windows
            os: windows-latest
            command: npm run dist:win -- --publish never
            artifact: dist/*-Windows-Setup.exe
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux -- --publish never
            artifact: dist/*-Linux.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/generate_icon.js

      - name: Build ${{ matrix.name }} app
        shell: bash
        run: |
          # An unset secret expands to an empty string, and electron-builder reads
          # an empty CSC_LINK as a certificate *path* — which resolves to the
          # project directory and fails with "<projectDir> not a file". Drop the
          # empty values so it takes the unsigned path instead.
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate configured - building unsigned."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -z "$APPLE_ID" ]; then
            echo "No Apple ID configured - skipping notarization."
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi

          ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: ibia-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match package.json version $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect the three installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write release notes
        run: sed "s/{{VERSION}}/${{ steps.version.outputs.version }}/g" .github/release-notes.md > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ibia ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/ibia-${{ steps.version.outputs.version }}-macOS.dmg
            release/ibia-${{ steps.version.outputs.version }}-Windows-Setup.exe
            release/ibia-${{ steps.version.outputs.version }}-Linux.AppImage
